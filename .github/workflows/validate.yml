name: macOS 26 validation

on:
  push:
    branches: [main, 'codex/**']
    paths:
      - 'Sources/**'
      - 'Tests/**'
      - 'scripts/**'
      - 'third-party/**'
      - '.github/**'
      - 'Package.swift'
      - 'Info.plist'
      - 'THIRD_PARTY_NOTICES.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  packaged:
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Record environment and input revision
        run: |
          mkdir -p build/ci
          { sw_vers; uname -m; xcrun swift --version; node --version; git rev-parse HEAD; } > build/ci/environment.txt
          python3 scripts/release_inputs.py > build/ci/tested-inputs.json
      - name: Unit tests
        run: ./scripts/test.sh 2>&1 | tee build/ci/unit.log
      - name: Optimized app and license checks
        run: ./scripts/build.sh release 2>&1 | tee build/ci/build.log
      - name: Packaged WebKit and native document API checks
        run: |
          ./scripts/prepare-smoke-app.sh "$PWD/build/ci/smoke"
          python3 - <<'PY'
          import pathlib, subprocess
          output = pathlib.Path('build/ci')
          with (output / 'smoke-process.log').open('w') as log:
              subprocess.run(['build/MacMermaid Smoke.app/Contents/MacOS/MacMermaid', '--smoke-test', str((output / 'smoke').resolve())], stdout=log, stderr=subprocess.STDOUT, check=True, timeout=900)
          results = (output / 'smoke/results.txt').read_text()
          print(results)
          assert results.splitlines()[-1] == 'SUCCESS', 'Packaged suite did not pass'
          PY
      - name: Verify package and archive tested app
        run: |
          codesign --verify --deep --strict build/MacMermaid.app
          shasum -a 256 build/MacMermaid.app/Contents/MacOS/MacMermaid > build/ci/executable.sha256
          ditto -c -k --sequesterRsrc --keepParent build/MacMermaid.app build/ci/MacMermaid-macos-26-arm64.zip
      - name: Retain evidence even when a check fails
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-26-validation-${{ github.sha }}
          path: build/ci
          retention-days: 30
          if-no-files-found: error
